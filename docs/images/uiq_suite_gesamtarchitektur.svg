<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>UIQ-Suite Gesamtarchitektur</title>
<desc>Fünf Module: UIQ, Premium Options und Refundex als Pipeline über einer gemeinsamen Datenbasis, darunter DepotIQ und Altersvorsorge als eingefrorene Zukunftsmodule. Farbe zeigt Status: türkis aktiv, grau mit durchgezogenem Rahmen im Wartungsmodus, grau mit gestricheltem Rahmen pausiert oder eingefroren.</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="360" fill="#FFFFFF"/>

<g>
<rect x="40" y="60" width="170" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="125" y="82" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">UIQ</text>
<text x="125" y="102" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Entscheiden · aktiv</text>
</g>

<line x1="210" y1="92" x2="238" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow3)"/>

<g>
<rect x="240" y="60" width="170" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="325" y="82" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Premium Options</text>
<text x="325" y="102" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Verwalten · pausiert</text>
</g>

<line x1="410" y1="92" x2="438" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow3)"/>

<g>
<rect x="440" y="60" width="170" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="525" y="82" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Refundex</text>
<text x="525" y="102" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Abrechnen · Wartung</text>
</g>

<line x1="125" y1="124" x2="125" y2="150" stroke="#5F5E5A" stroke-width="1"/>
<line x1="325" y1="124" x2="325" y2="150" stroke="#5F5E5A" stroke-width="1"/>
<line x1="525" y1="124" x2="525" y2="150" stroke="#5F5E5A" stroke-width="1"/>

<g>
<rect x="40" y="150" width="600" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Gemeinsame Datenbasis</text>
<text x="340" y="186" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Track Record · Marktdaten · KV-Storage</text>
</g>

<line x1="230" y1="200" x2="230" y2="228" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="450" y1="200" x2="450" y2="228" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>

<g>
<rect x="140" y="230" width="180" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="230" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">DepotIQ</text>
<text x="230" y="272" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Bilanz · gefroren</text>
</g>
<g>
<rect x="360" y="230" width="180" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="450" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Altersvorsorge</text>
