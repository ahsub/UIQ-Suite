<text x="340" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Türkis = aktiv (Phase 0) · durchgezogen = Wartungsmodus · gestrichelt = pausiert bis Phase 3</text>
</svg>
